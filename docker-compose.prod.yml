version: '3.8'

# 生产环境配置
services:
  mysql:
    image: mysql:8.0
    container_name: scrapy_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: scrapy_db
      MYSQL_USER: ${MYSQL_USER:-scrapy_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scrapy_pass}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scrapy_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: scrapy_backend_prod
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: scrapy_db
      MYSQL_USER: ${MYSQL_USER:-scrapy_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scrapy_pass}
      FLASK_ENV: production
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./scrapy_project:/app/scrapy_project:ro
      - ./backend:/app
      - ./config.json:/app/config.json:ro
      - ./utils:/app/utils:ro
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scrapy_network_prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/statistics"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scrapy_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - scrapy_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data_prod:
    driver: local

networks:
  scrapy_network_prod:
    driver: bridge
