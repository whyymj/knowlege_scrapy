version: '3.8'

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: scrapy_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: scrapy_db
      MYSQL_USER: scrapy_user
      MYSQL_PASSWORD: scrapy_pass
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./config.json:/app/config.json:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scrapy_network

  # 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: scrapy_backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: scrapy_db
      MYSQL_USER: scrapy_user
      MYSQL_PASSWORD: scrapy_pass
      FLASK_ENV: production
    ports:
      - "6000:5000"
    volumes:
      - ./scrapy_project:/app/scrapy_project:ro
      - ./backend:/app
      - ./config.json:/app/config.json:ro
      - ./utils:/app/utils:ro
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scrapy_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/api/statistics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scrapy_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - scrapy_network

volumes:
  mysql_data:
    driver: local

networks:
  scrapy_network:
    driver: bridge
